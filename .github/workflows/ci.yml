name: CI

on:
  push:
  pull_request:

env:
  ALLOW_DEV_SECRET: 'true'
  DEBUG: 'true'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carbonless_backend
    # INVENTORY_OWNERSHIP_CUTOVER is deliberately NOT set here. Tests that need ownership-scoped inventories pin their own
    # value with @override_settings (and `settings_test`, used by the file-backed steps below, carries its own). Exporting
    # a 2000-01-01 cutover job-wide makes every test-created inventory ownership-scoped, which defeats the tests of
    # legacy UNLINKED inventories (they must stay refused with 409 inventory_not_ownership_scoped): five of them fail.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python manage.py test emissions accounts questionnaire companies chat --exclude-tag=filedb_only
      # The concurrency test needs real SQLite file locking (Django's in-memory test database cannot wait on a
      # table lock): it runs here, on the file-backed test settings. The guard fails the step if the tag or the
      # label ever stops selecting exactly that test (a run of zero tests would otherwise pass silently).
      - name: Concurrency tests (file-backed SQLite)
        run: |
          python manage.py test questionnaire.test_stage3_lifecycle --tag=filedb_only --settings=carbonless_api.settings_test_filedb 2>&1 | tee filedb_only.log
          grep -E '^Ran 1 test in ' filedb_only.log
      # Several same-year inventories started at once: also needs real file locking (same reason).
      - name: Concurrent inventory starts (file-backed SQLite)
        run: |
          python manage.py test questionnaire.test_inventory_year_integrity --tag=filedb_only --settings=carbonless_api.settings_test_filedb 2>&1 | tee filedb_starts.log
          grep -E '^Ran 1 test in ' filedb_starts.log
      # Simultaneous refreshes of one refresh token: exactly one may succeed (real file locking, threads, own connections).
      - name: Simultaneous refresh tokens (file-backed SQLite)
        run: |
          python manage.py test accounts.test_refresh_concurrency --tag=filedb_only --settings=carbonless_api.settings_test_filedb 2>&1 | tee filedb_refresh.log
          grep -E '^Ran 5 tests in ' filedb_refresh.log
          grep -E '^OK$' filedb_refresh.log

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus_insights-saas-neon_nextjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build

