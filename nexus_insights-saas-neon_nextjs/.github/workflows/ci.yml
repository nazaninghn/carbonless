# ─── Carbonless CI ───────────────────────────────────────────────────────────
# Runs on every push to main and on every pull request targeting main.
# Four gates: type-check → lint → build → e2e smoke tests.
# All four must pass before a PR can be merged.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: TypeScript + ESLint ─────────────────────────────────────────────
  typecheck-and-lint:
    name: Type-check & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'                  # caches ~/.npm — speeds up reinstalls

      - name: Install dependencies
        run: npm ci --prefer-offline    # reproducible, uses package-lock.json

      - name: TypeScript — tsc --noEmit
        run: npx tsc --noEmit
        # checkJs:false in tsconfig means only .ts/.tsx + @ts-check files are checked.
        # Zero errors expected after Round 28 migration.

      - name: ESLint
        run: npm run lint
        # Direct ESLint CLI (eslint src/ --ext .js,.jsx,.ts,.tsx)
        # No env vars needed — no Next.js bundler involved at lint time.

  # ── Job 2: Next.js build ───────────────────────────────────────────────────
  # Catches broken imports, missing env vars, and page-level compile errors
  # that tsc alone won't find (e.g. invalid JSX, bad Tailwind class names in
  # dynamic expressions that cause PostCSS failures).
  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typecheck-and-lint        # only build if type-check + lint passed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build
        run: npm run build
        env:
          # Dummy value keeps api.js happy at build time; no real requests are made
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
          # Tell Next.js this is a CI environment (disables telemetry)
          NEXT_TELEMETRY_DISABLED: '1'

      # Upload the compiled .next/ output so the e2e job can start the server
      # without rebuilding from scratch (saves ~2-3 minutes per run).
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next/
            public/
          retention-days: 1

  # ── Job 3: Playwright E2E smoke tests ─────────────────────────────────────
  # Starts the pre-built Next.js app with `next start`, then runs the smoke
  # suite against it.  All Django API calls are mocked by page.route() inside
  # the test files — no real backend is required.
  e2e:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build                   # only run after build passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        # playwright.config.js webServer: CI ? 'npm start' : 'npm run dev'
        # → Playwright starts `next start` against the .next/ artifact above.
        # All Django API calls are mocked by page.route() — no real backend needed.
        run: npx playwright test
        env:
          NEXT_PUBLIC_API_URL:     http://localhost:8000/api
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
